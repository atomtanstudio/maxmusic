<!doctype html>
<html lang="en" data-shell="booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="MaxMusic — write, render and keep your own songs.">
<title>MaxMusic</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/shell.css">
</head>
<body>

<!-- =================================================================== -->

<div class="app" id="app">

  <!-- ---------------- Left nav rail ---------------- -->
  <aside class="rail" id="rail">
    <div class="rail__head">
      <a class="brand" href="#/create" aria-label="MaxMusic — home">
        <span class="brandmark"><img src="/logo.png" alt=""></span>
        <span class="brand__name">MaxMusic</span>
      </a>
      <button class="railtoggle" id="rail-toggle" type="button"
              aria-label="Collapse navigation" title="Collapse navigation">
        <svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg>
      </button>
    </div>

    <nav class="rail__nav" id="rail-nav" aria-label="Primary">
      <a class="navitem" href="#/create"   data-route="create">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-create"/></svg>
        <span class="navitem__label">Create</span>
      </a>
      <a class="navitem" href="#/studio"   data-route="studio">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-studio"/></svg>
        <span class="navitem__label">Studio</span>
      </a>
      <a class="navitem" href="#/library"  data-route="library">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-library"/></svg>
        <span class="navitem__label">Library</span>
        <span class="navitem__count" id="nav-library-count" hidden></span>
      </a>
      <a class="navitem" href="#/lyrics"   data-route="lyrics">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-lyrics"/></svg>
        <span class="navitem__label">Lyrics</span>
      </a>
      <a class="navitem" href="#/covers"   data-route="covers">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-covers"/></svg>
        <span class="navitem__label">Covers</span>
      </a>
    </nav>

    <div class="rail__spacer"></div>

    <nav class="rail__nav rail__nav--foot" aria-label="Secondary">
      <a class="navitem" href="#/settings" data-route="settings">
        <svg class="navitem__icon" aria-hidden="true"><use href="#i-settings"/></svg>
        <span class="navitem__label">Settings</span>
      </a>
    </nav>

    <!-- Anchor slot: who you are + the one thing you came here to do. -->
    <div class="railfoot">
      <div class="workspace" id="workspace">
        <button class="workspace__btn" id="workspace-btn" type="button"
                aria-haspopup="menu" aria-expanded="false" aria-label="Workspace options">
          <span class="workspace__avatar" id="workspace-avatar" aria-hidden="true">M</span>
          <span class="workspace__text">
            <span class="workspace__name" id="workspace-name">My Studio</span>
            <span class="workspace__meta" id="workspace-meta">Local workspace</span>
          </span>
          <svg class="icon workspace__chev" aria-hidden="true"><use href="#i-chevron-up"/></svg>
        </button>
        <input class="workspace__rename" id="workspace-rename" type="text"
               maxlength="28" spellcheck="false" autocomplete="off"
               aria-label="Workspace name" hidden>
      </div>

      <a class="btn btn--outline btn--block railfoot__cta" href="#/create">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        <span class="railfoot__cta-label">New song</span>
      </a>
    </div>
  </aside>

  <div class="rail-scrim" id="rail-scrim" hidden></div>

  <!-- ---------------- Main region ---------------- -->
  <main class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="actionchip topbar__menu" id="nav-open" type="button" aria-label="Open navigation">
        <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <div class="topbar__titles">
        <h1 class="topbar__title" id="topbar-title">MaxMusic</h1>
        <p class="topbar__sub" id="topbar-sub" hidden></p>
      </div>
      <div class="topbar__actions" id="topbar-actions"></div>
    </header>

    <div class="screen" id="screen" role="region" aria-live="polite">
      <div class="boot">
        <span class="boot__mark brandmark"><img src="/logo.png" alt=""></span>
        <p class="boot__text">Loading MaxMusic…</p>
      </div>
    </div>
  </main>

  <!-- ---------------- Persistent player ---------------- -->
  <footer class="playerbar" id="player-root" data-state="unavailable" aria-label="Player">
    <div class="playerbar__fallback" id="player-fallback">
      <svg class="icon playerbar__fallback-icon" aria-hidden="true"><use href="#i-wave"/></svg>
      <span class="playerbar__fallback-text" id="player-fallback-text">Playback is starting…</span>
    </div>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
